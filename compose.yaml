services:
  dev:
    image: ghcr.io/flipstone/haskell-tools:debian-ghc-9.10.3-build-2026.9.29.65@sha256:e9f9ce9e125ede479e13595ac8113cde5a3266066404ecc94aad8f4c28c0e3a4
    environment:
      STACK_ROOT: /stack-root
      IN_DEV_CONTAINER: 'true'
      # Pass through the CI variable from GitHub (or set it to `true` locally
      # for debugging CI builds)
      CI:
    volumes:
      - .:${PROJECT_DIR}
      - flipstone_stack_root:/stack-root
    working_dir: ${PROJECT_DIR}
    tty: true

volumes:
  flipstone_stack_root:
    external: true
